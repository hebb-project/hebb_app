version: "3"

# Hebb — desktop app + visualizer task runner
# Run `task` to list everything. Run `task <name>` to execute.
#
# Layout:
#   core/         Rust SNN simulator server (axum + diesel)  → core:*
#   web/          Next.js + Tailwind frontend (visualizer)   → web:*
#   desktop/      Tauri 2 shell that bundles core + web      → desktop:*

vars:
  WEB_PORT: '{{.WEB_PORT | default "3737"}}'
  CORE_PORT: '{{.CORE_PORT | default "8080"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  install:
    desc: Install all dependencies (web + desktop)
    cmds:
      - task: web:install
      - task: desktop:install

  dev:
    desc: Full stack (docker postgres + core + web dev server)
    cmds:
      - docker compose up -d postgres
      - sleep 1
      - cargo run --release -p core &
      - task: web:dev

  dev:down:
    desc: Stop docker postgres
    cmds:
      - docker compose down

  build:
    desc: Production build of core + web
    cmds:
      - task: core:build
      - task: web:build

  clean:
    desc: Remove build artifacts and node_modules
    cmds:
      - rm -rf web/.next web/node_modules
      - rm -rf target 2>/dev/null || true
      - rm -rf desktop/src-tauri/target 2>/dev/null || true

  # ── web ─────────────────────────────────────────────────────────────────
  web:install:
    desc: Install web dependencies
    dir: web
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  web:dev:
    desc: Run Next.js dev server (port {{.WEB_PORT}}, turbopack)
    dir: web
    deps: [web:install]
    cmds:
      - npx next dev --turbopack --port {{.WEB_PORT}}

  web:build:
    desc: Production build of the web app
    dir: web
    deps: [web:install]
    cmds:
      - npx next build

  web:start:
    desc: Run the production build (port {{.WEB_PORT}})
    dir: web
    deps: [web:build]
    cmds:
      - npx next start --port {{.WEB_PORT}}

  web:lint:
    desc: Lint web sources
    dir: web
    deps: [web:install]
    cmds:
      - npx next lint

  web:typecheck:
    desc: Typecheck web sources (no emit)
    dir: web
    deps: [web:install]
    cmds:
      - npx tsc --noEmit

  web:check:
    desc: Lint + typecheck + build (use before commit)
    cmds:
      - task: web:typecheck
      - task: web:lint
      - task: web:build

  # ── core ────────────────────────────────────────────────────────────────
  core:build:
    desc: Build the Rust core (cargo build --release)
    cmds:
      - cargo build --release -p core

  core:build-dev:
    desc: Debug build of the core binary (used by desktop:dev)
    cmds:
      - cargo build -p core

  core:run:
    desc: Run the Rust core SNN server (port {{.CORE_PORT}})
    cmds:
      - cargo run --release -p core

  core:test:
    desc: Run Rust tests
    cmds:
      - cargo test -p core

  core:fmt:
    desc: Format Rust sources
    cmds:
      - cargo fmt

  core:clippy:
    desc: Lint Rust sources
    cmds:
      - cargo clippy -p core -- -D warnings

  core:migrate:
    desc: Run diesel migrations against $DATABASE_URL
    dir: core
    cmds:
      - diesel migration run

  # ── docker ──────────────────────────────────────────────────────────────
  docker:up:
    desc: docker compose up -d (postgres + core image)
    cmds:
      - docker compose up -d --build

  docker:down:
    desc: docker compose down (keep volumes)
    cmds:
      - docker compose down

  docker:nuke:
    desc: docker compose down -v (wipes the postgres volume)
    cmds:
      - docker compose down -v

  # ── desktop (Tauri shell) ───────────────────────────────────────────────
  desktop:install:
    desc: Install desktop shell deps (Tauri 2 CLI)
    dir: desktop
    cmds:
      - npm install

  desktop:dev:
    desc: Run the Tauri shell (boots Next dev server + opens a webview window)
    dir: desktop
    deps: [desktop:install, web:install, core:build-dev]
    cmds:
      - npm run dev

  desktop:build:
    desc: Build a desktop bundle (release artifacts under desktop/src-tauri/target/release)
    dir: desktop
    deps: [desktop:install, web:install]
    cmds:
      - npm run build
