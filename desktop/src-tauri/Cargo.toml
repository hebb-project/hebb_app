[package]
name = "long-horizon-cortex-desktop"
version = "0.0.1"
edition = "2021"
description = "Tauri 2 desktop shell for the Long Horizon Cortex"
publish = false

# `lib` produces the library half (so `main.rs` can call into `lib.rs::run`
# and mobile targets can use `tauri::mobile_entry_point`). `staticlib`/`cdylib`
# are needed for mobile linking even though desktop only consumes `rlib`.
[lib]
name = "long_horizon_cortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
