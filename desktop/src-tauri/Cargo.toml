[package]
name = "long-horizon-cortex-desktop"
version = "0.0.1"
edition = "2021"
description = "Tauri 2 desktop shell for Cortex"
publish = false

# `lib` produces the library half (so `main.rs` can call into `lib.rs::run`
# and mobile targets can use `tauri::mobile_entry_point`). `staticlib`/`cdylib`
# are needed for mobile linking even though desktop only consumes `rlib`.
[lib]
name = "long_horizon_cortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Subprocess supervisor (COR-33). Multi-threaded runtime so the Tauri
# main thread doesn't block on supervisor tasks; `process` is the tokio
# feature gate for `tokio::process::Command`; `io-util` gives the
# buffered async readers used to forward child stdout/stderr.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal", "net"] }
anyhow = "1"
thiserror = "2"

# Embedded Postgres provider (COR-33; see ADR-002 + supervisor::postgres::embedded).
# Downloads PG binaries on first run to a cache dir; the `tokio` API matches
# the rest of our async surface. Pinned at the major-version level so the
# binary cache doesn't churn on patch releases.
postgresql_embedded = { version = "0.18", default-features = true }

# Postgres URL parsing for the External provider's reachability check.
url = "2"
tauri-plugin-dialog = "2.7.1"

# Timestamps + stable ids for `.cortex/metadata.json`. `chrono` for
# RFC 3339 strings (the public JSON format); `uuid` v4 for the network
# `id` field so it never collides if multiple networks live under the
# same parent directory or get rsync'd between machines.
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Seed-network generators + the disk-backed `Cortex` handle. The
# desktop shell only consumes these for one Tauri command
# (`seed_cortex_folder`) — running the generator + applying it to
# `topology.json` happens locally so we don't have to spin core up
# first. `disk` is required so `cortex_snn::Cortex` is exported.
cortex-snn = { path = "../../cortex-snn", features = ["disk"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
