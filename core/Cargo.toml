[package]
name = "core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Long-horizon cortex mechanism — Rust SNN simulator + axum server"

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
# SNN substrate — the simulator, neuron/synapse traits, and wire types
# live here. `core` is just the axum/tokio/DB shell around it.
# `disk` feature pulls in `hebb::Cortex` so the engine actor can
# hydrate from a `.cortex/` folder via `POST /api/cortex/open`. The
# substrate stays I/O-free for other consumers; only core opts in.
hebb = { version = "0.1", features = ["disk"] }

# Async runtime / web
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "fs", "io-util"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"

# Serde / JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (sync diesel via spawn_blocking + r2d2 — diesel-async is fine
# but sync is rock-solid and faster to iterate on).
diesel = { version = "~2.2.6", features = ["postgres", "uuid", "chrono", "serde_json", "r2d2"] }
diesel_migrations = "~2.2.0"
r2d2 = "0.8"

# IDs / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy = "0.15"
envy = "0.4"

# Vault parsing
pulldown-cmark = "0.12"
walkdir = "2"
serde_yaml = "0.9"

# Misc
rand = "0.8"
once_cell = "1"

# HTTP client for the optional Anthropic / Gemini chat encoders.
# `rustls-tls` keeps the build openssl-free, which makes cross-compiling
# the core binary for desktop bundling (Phase 4) drastically easier.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# `async fn` in traits isn't dyn-compatible without help. async-trait
# is the smallest, most boring fix; keeps the encoder factory's `Arc<
# dyn ChatEncoder>` pattern viable so adding a future embedding /
# gemini encoder is additive, not a refactor.
async-trait = "0.1"
jsonschema = { version = "0.46.5", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

# Release profile is set at the workspace root (../Cargo.toml).

# Deny new warnings at compile time so future PRs cannot silently
# accumulate dead code or unused imports. Intentional dead code
# (e.g. the agent harness skeleton) carries an explicit #[allow] with
# a TODO pointing at the follow-up PR.
[lints.rust]
warnings = "deny"
